replicaCount: 1

image:
  repository: localhost:5000/kube-llmops/operator
  tag: v0.1.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: kube-llmops-operator

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Bootstrap CRDs/Helm components with an external cluster-admin only.
# Runtime Operator itself is per-namespace and least privileged.
environment: production
chartPath: /charts/kube-llmops-stack

gateway:
  # LiteLLM gateway URL. Set to enable model registration via /model/new API.
  url: "http://kube-llmops-litellm:4000"
  # Master key for LiteLLM API authentication.
  existingSecret: kube-llmops-litellm-secret
