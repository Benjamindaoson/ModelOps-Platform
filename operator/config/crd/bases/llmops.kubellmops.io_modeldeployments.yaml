---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: modeldeployments.llmops.kubellmops.io
spec:
  group: llmops.kubellmops.io
  names:
    kind: ModelDeployment
    listKind: ModelDeploymentList
    plural: modeldeployments
    shortNames:
    - md
    singular: modeldeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.engine
      name: Engine
      type: string
    - jsonPath: .status.readyReplicas
      name: Replicas
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelDeployment is the Schema for the modeldeployments API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelDeploymentSpec defines the desired state of a model
              deployment.
            properties:
              accelerator:
                default: nvidia
                description: Accelerator selects the GPU vendor for scheduling.
                enum:
                - nvidia
                - amd
                - gaudi
                type: string
              autoScaling:
                description: AutoScaling configures automatic scaling for this model.
                properties:
                  enabled:
                    description: Enabled enables automatic scaling.
                    type: boolean
                  kedaTriggers:
                    description: KEDATriggers defines KEDA-specific trigger configuration.
                    properties:
                      queueDepthEnabled:
                        description: QueueDepthEnabled enables scaling based on vLLM
                          queue depth.
                        type: boolean
                      queueDepthMetric:
                        description: QueueDepthMetric is the Prometheus metric name
                          for queue depth.
                        type: string
                      queueDepthThreshold:
                        description: QueueDepthThreshold is the threshold for queue
                          depth scaling.
                        format: int32
                        type: integer
                      tpotEnabled:
                        description: TPOTEnabled enables scaling based on TPOT P95
                          latency.
                        type: boolean
                      tpotThreshold:
                        description: TPOTThreshold is the TPOT P95 threshold in seconds.
                        type: number
                      ttftEnabled:
                        description: TTFTEnabled enables scaling based on TTFT P95
                          latency.
                        type: boolean
                      ttftThreshold:
                        description: TTFTThreshold is the TTFT P95 threshold in seconds.
                        type: number
                    type: object
                  maxReplicas:
                    description: MaxReplicas is the maximum number of replicas.
                    format: int32
                    type: integer
                  minReplicas:
                    description: MinReplicas is the minimum number of replicas.
                    format: int32
                    type: integer
                  scaleTargetCPUUtilizationPercentage:
                    description: ScaleTargetCPUUtilizationPercentage is the target
                      CPU utilization for HPA.
                    format: int32
                    type: integer
                  scaleTargetMemoryUtilizationPercentage:
                    description: ScaleTargetMemoryUtilizationPercentage is the target
                      memory utilization for HPA.
                    format: int32
                    type: integer
                  useKEDA:
                    description: UseKEDA enables KEDA-based autoscaling instead of
                      HPA.
                    type: boolean
                type: object
              cache:
                description: Cache preserves legacy prefixCaching while exposing unified
                  settings.
                properties:
                  prefixCaching:
                    type: boolean
                required:
                - prefixCaching
                type: object
              canary:
                description: Canary configures a canary deployment for A/B traffic
                  splitting.
                properties:
                  digest:
                    description: Digest is the verified SHA-256 of the candidate checkpoint
                      tree.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  resources:
                    description: Resources for the canary deployment.
                    properties:
                      cpu:
                        default: "4"
                        description: CPU is the CPU limit (e.g. "4").
                        type: string
                      gpu:
                        default: 1
                        description: GPU is the number of GPUs to request (0 for CPU-only).
                        format: int32
                        minimum: 0
                        type: integer
                      memory:
                        default: 16Gi
                        description: Memory is the memory limit (e.g. "16Gi").
                        type: string
                    type: object
                  revision:
                    description: Revision identifies a pinned model snapshot. For
                      HF this is the commit SHA.
                    minLength: 7
                    type: string
                  source:
                    description: Source is the HuggingFace model ID for the canary
                      model.
                    type: string
                  weight:
                    description: Weight is the percentage of traffic routed to the
                      canary (0-100).
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                required:
                - digest
                - revision
                - source
                - weight
                type: object
              custom:
                description: Custom declares a continuous-action server; never a Chat
                  Completion adapter.
                properties:
                  args:
                    items:
                      type: string
                    type: array
                  command:
                    items:
                      type: string
                    minItems: 1
                    type: array
                  healthPath:
                    enum:
                    - /health
                    - /readyz
                    type: string
                  image:
                    pattern: ^.+@sha256:[a-f0-9]{64}$
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1024
                    type: integer
                required:
                - command
                - healthPath
                - image
                - port
                type: object
              engine:
                default: auto
                description: Engine selects the inference engine. "auto" detects from
                  source name.
                enum:
                - auto
                - vllm
                - sglang
                - tei
                - llamacpp
                - custom
                type: string
              engineArgs:
                additionalProperties:
                  type: string
                description: EngineArgs are extra CLI arguments passed to the inference
                  engine.
                type: object
              migDevice:
                description: MIGDevice specifies an NVIDIA MIG device resource name,
                  overriding the gpu field.
                type: string
              model:
                description: Model links this workload to a unified immutable Registry
                  artifact.
                properties:
                  artifactURI:
                    description: ArtifactURI points to an authenticated immutable
                      S3 bundle when used.
                    type: string
                  digest:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  id:
                    type: string
                  modelType:
                    enum:
                    - llm
                    - vlm
                    - vla
                    - embedding
                    type: string
                  revision:
                    type: string
                required:
                - digest
                - id
                - modelType
                - revision
                type: object
              modelStore:
                description: ModelStore overrides the platform-level model store configuration.
                properties:
                  bucket:
                    description: Bucket is the MinIO bucket name.
                    type: string
                  endpoint:
                    description: Endpoint is the MinIO endpoint (e.g. "kube-llmops-minio:9000").
                    type: string
                type: object
              prefixCaching:
                description: PrefixCaching enables vLLM automatic prefix caching.
                type: boolean
              quantization:
                description: Quantization is explicit and validated against the selected
                  engine.
                enum:
                - none
                - awq
                - gptq
                - bitsandbytes
                type: string
              replicas:
                default: 1
                description: Replicas is the desired number of model serving pods.
                format: int32
                minimum: 0
                type: integer
              resources:
                description: Resources specifies compute resources for the model serving
                  container.
                properties:
                  cpu:
                    default: "4"
                    description: CPU is the CPU limit (e.g. "4").
                    type: string
                  gpu:
                    default: 1
                    description: GPU is the number of GPUs to request (0 for CPU-only).
                    format: int32
                    minimum: 0
                    type: integer
                  memory:
                    default: 16Gi
                    description: Memory is the memory limit (e.g. "16Gi").
                    type: string
                type: object
              source:
                description: Source is the HuggingFace model ID or path (e.g. "Qwen/Qwen2.5-7B-Instruct").
                minLength: 1
                type: string
              spot:
                description: Spot configures spot/preemptible GPU scheduling.
                properties:
                  enabled:
                    description: Enabled enables spot instance scheduling.
                    type: boolean
                  provider:
                    description: Provider selects the cloud provider for spot tolerations.
                    enum:
                    - aws
                    - gcp
                    - azure
                    - karpenter
                    type: string
                type: object
            required:
            - source
            type: object
          status:
            description: ModelDeploymentStatus defines the observed state of ModelDeployment.
            properties:
              canary:
                description: Canary holds the status of the canary deployment.
                properties:
                  endpoint:
                    description: Endpoint is the in-cluster URL for the canary model
                      API.
                    type: string
                  phase:
                    description: Phase is the canary deployment phase.
                    type: string
                  readyReplicas:
                    description: ReadyReplicas is the number of ready canary pods.
                    format: int32
                    type: integer
                type: object
              conditions:
                description: Conditions represent the latest observations of the resource's
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              downloadProgress:
                description: DownloadProgress holds download progress information.
                properties:
                  bytesDownloaded:
                    description: BytesDownloaded is the number of bytes downloaded.
                    format: int64
                    type: integer
                  completionTime:
                    description: CompletionTime is when the download completed.
                    format: date-time
                    type: string
                  percentage:
                    description: Percentage is the download progress percentage.
                    format: int32
                    type: integer
                  startTime:
                    description: StartTime is when the download started.
                    format: date-time
                    type: string
                  totalBytes:
                    description: TotalBytes is the total size in bytes.
                    format: int64
                    type: integer
                type: object
              endpoint:
                description: Endpoint is the in-cluster URL for the model's API.
                type: string
              engine:
                description: Engine is the resolved engine after auto-detection.
                type: string
              initContainerStatus:
                description: InitContainerStatus holds the init container state.
                properties:
                  message:
                    description: Message contains progress message.
                    type: string
                  phase:
                    description: Phase is the init container phase (Pending, Running,
                      Terminated).
                    type: string
                type: object
              modelSize:
                description: ModelSize is the discovered model size after download.
                type: string
              phase:
                description: Phase is the high-level lifecycle phase.
                enum:
                - Pending
                - Downloading
                - Deploying
                - Ready
                - Degraded
                - Failed
                type: string
              readyReplicas:
                description: ReadyReplicas is the number of ready model serving pods.
                format: int32
                type: integer
              totalReplicas:
                description: TotalReplicas is the desired number of replicas.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
