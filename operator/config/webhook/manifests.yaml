---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-llmops-kubellmops-io-v1alpha1-finetunerun
  failurePolicy: Fail
  name: vfinetunerun.kubellmops.io
  rules:
  - apiGroups:
    - llmops.kubellmops.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - finetuneruns
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-llmops-kubellmops-io-v1alpha1-llmplatform
  failurePolicy: Fail
  name: vllmplatform.kubellmops.io
  rules:
  - apiGroups:
    - llmops.kubellmops.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - llmplatforms
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-llmops-kubellmops-io-v1alpha1-modeldeployment
  failurePolicy: Fail
  name: vmodeldeployment.kubellmops.io
  rules:
  - apiGroups:
    - llmops.kubellmops.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modeldeployments
  sideEffects: None
