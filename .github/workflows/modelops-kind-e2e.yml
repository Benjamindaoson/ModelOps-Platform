name: ModelOps CPU Kubernetes live smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "ops/**"
      - ".github/workflows/modelops-kind-e2e.yml"
  workflow_dispatch: {}
concurrency:
  group: modelops-kind-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - uses: helm/kind-action@v1
      - name: Prepare chart dependencies
        run: helm dependency update charts/kube-llmops-stack
      - name: Install real CPU-only Kubernetes services
        run: |
          helm install kube-llmops charts/kube-llmops-stack \
            -f charts/kube-llmops-stack/values-ci.yaml --wait --timeout 12m
      - name: Verify actual pods and LiteLLM health endpoint
        run: |
          kubectl get pods -A -o wide
          kubectl rollout status deployment/kube-llmops-litellm-pg --timeout=120s
          kubectl rollout status deployment/kube-llmops-litellm --timeout=120s
          kubectl port-forward svc/kube-llmops-litellm 4000:4000 > /tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl --max-time 5 -fsS http://127.0.0.1:4000/health/liveliness; then
              echo "Kubernetes gateway LIVE; no GPU model has been deployed."
              exit 0
            fi
            sleep 3
          done
          cat /tmp/pf.log
          exit 1
      - name: Uninstall and inspect leftovers
        if: always()
        run: |
          helm uninstall kube-llmops || true
          kubectl get pods -A || true

  kind-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - uses: helm/kind-action@v1
      - name: Bootstrap CRDs and namespace boundaries
        run: |
          kubectl apply -f operator/config/crd/bases/
          kubectl create secret generic kube-llmops-litellm-secret --from-literal=master-key=test-only-not-valid-for-production
      - name: Build real Go Operator and load into kind
        run: |
          docker build -t modelops/operator:e2e -f operator/Dockerfile operator/
          kind load docker-image modelops/operator:e2e
      - name: Deploy namespace-scoped runtime Operator
        run: |
          helm install modelops-op operator/charts/kube-llmops-operator \
            --set image.repository=modelops/operator --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent --set gateway.url=http://127.0.0.1:4000 \
            --wait --timeout 8m
          kubectl rollout status deployment/modelops-op-operator --timeout=180s
      - name: Assert least privilege against actual Kubernetes RBAC
        run: |
          set -euo pipefail
          SA=system:serviceaccount:default:kube-llmops-operator
          kubectl auth can-i create deployments --as="$SA" -n default | grep -qx yes
          kubectl auth can-i create deployments --as="$SA" -n kube-system | grep -qx no
          kubectl auth can-i delete namespaces --as="$SA" | grep -qx no
          kubectl auth can-i get secrets --as="$SA" -n default | grep -qx no
      - name: Verify genuine Controller reconciliation without a GPU
        run: |
          set -euo pipefail
          cat <<'YAML' | kubectl apply -f -
          apiVersion: llmops.kubellmops.io/v1alpha1
          kind: ModelDeployment
          metadata:
            name: modelops-controller-e2e
          spec:
            source: Qwen/Qwen2.5-0.5B-Instruct
            engine: vllm
            replicas: 1
            resources:
              gpu: 1
              cpu: "1"
              memory: 4Gi
          YAML
          for i in $(seq 1 45); do
            if kubectl get deployment modelops-controller-e2e >/dev/null 2>&1 &&
               kubectl get service modelops-controller-e2e >/dev/null 2>&1 &&
               kubectl get pvc modelops-controller-e2e-cache >/dev/null 2>&1; then
              echo "Operator reconciled PVC/Deployment/Service. GPU workload is NOT running."
              kubectl get modeldeployment modelops-controller-e2e -o yaml
              exit 0
            fi
            sleep 4
          done
          kubectl get all
          kubectl logs deployment/modelops-op-operator --tail=200
          exit 1
