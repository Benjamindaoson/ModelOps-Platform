name: ModelOps CPU Kubernetes live smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "operator/**"
      - "ops/**"
      - ".github/workflows/modelops-kind-e2e.yml"
  workflow_dispatch: {}
concurrency:
  group: modelops-kind-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - uses: helm/kind-action@v1
      - name: Prepare chart dependencies
        run: helm dependency update charts/kube-llmops-stack
      - name: Install real CPU-only Kubernetes services
        run: |
          helm install kube-llmops charts/kube-llmops-stack \
            -f charts/kube-llmops-stack/values-ci.yaml --wait --timeout 12m
      - name: Verify actual pods and LiteLLM health endpoint
        run: |
          kubectl get pods -A -o wide
          kubectl rollout status deployment/kube-llmops-litellm-pg --timeout=120s
          kubectl rollout status deployment/kube-llmops-litellm --timeout=120s
          kubectl port-forward svc/kube-llmops-litellm 4000:4000 > /tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl --max-time 5 -fsS http://127.0.0.1:4000/health/liveliness; then
              echo "Kubernetes gateway LIVE; no GPU model has been deployed."
              exit 0
            fi
            sleep 3
          done
          cat /tmp/pf.log
          exit 1
      - name: Uninstall and inspect leftovers
        if: always()
        run: |
          helm uninstall kube-llmops || true
          kubectl get pods -A || true

  kind-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - uses: helm/kind-action@v1
      - name: Bootstrap CRDs and namespace boundaries
        run: |
          kubectl apply -f operator/config/crd/bases/
          kubectl create secret generic kube-llmops-litellm-secret --from-literal=master-key=test-only-not-valid-for-production
      - name: Build real Go Operator and load into kind
        run: |
          docker build -t modelops/operator:e2e -f operator/Dockerfile operator/
          kind load docker-image modelops/operator:e2e --name chart-testing
      - name: Deploy namespace-scoped runtime Operator
        run: |
          helm install modelops-op operator/charts/kube-llmops-operator \
            --set image.repository=modelops/operator --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent --set gateway.url=http://127.0.0.1:4000 \
            --wait --timeout 8m
          kubectl rollout status deployment/modelops-op-operator --timeout=180s
      - name: Assert least privilege against actual Kubernetes RBAC
        run: |
          set -euo pipefail
          SA=system:serviceaccount:default:kube-llmops-operator
          kubectl get role,rolebinding -n default
          # kubectl auth can-i exits nonzero for DENIED; under pipefail, piping
          # that result through grep -qx no incorrectly fails the test.
          kubectl auth can-i create deployments --as="$SA" -n default --quiet
          if kubectl auth can-i create deployments --as="$SA" -n kube-system --quiet; then
            echo "SECURITY FAILURE: operator may modify kube-system" >&2
            exit 1
          fi
          if kubectl auth can-i delete namespaces --as="$SA" --quiet; then
            echo "SECURITY FAILURE: operator may delete namespaces" >&2
            exit 1
          fi
          if kubectl auth can-i get secrets --as="$SA" -n default --quiet; then
            echo "SECURITY FAILURE: operator may read tenant Secrets" >&2
            exit 1
          fi
          echo "Actual Kubernetes RBAC: tenant writes allowed; cross-namespace and secret access denied"
      - name: Verify genuine Controller reconciliation without a GPU
        run: |
          set -euo pipefail
          cat <<'YAML' | kubectl apply -f -
          apiVersion: llmops.kubellmops.io/v1alpha1
          kind: ModelDeployment
          metadata:
            name: modelops-controller-e2e
          spec:
            source: Qwen/Qwen2.5-0.5B-Instruct
            engine: vllm
            replicas: 1
            resources:
              gpu: 1
              cpu: "1"
              memory: 4Gi
          YAML
          for i in $(seq 1 45); do
            if kubectl get deployment modelops-controller-e2e >/dev/null 2>&1 &&
               kubectl get service modelops-controller-e2e >/dev/null 2>&1 &&
               kubectl get pvc modelops-controller-e2e-cache >/dev/null 2>&1; then
              echo "Operator reconciled PVC/Deployment/Service. GPU workload is NOT running."
              kubectl get modeldeployment modelops-controller-e2e -o yaml
              exit 0
            fi
            sleep 4
          done
          kubectl get all
          kubectl logs deployment/modelops-op-operator --tail=200
          exit 1
      - name: Verify Canary model-loader and safe cleanup in real Kubernetes
        run: |
          set -euo pipefail
          REVISION=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DIGEST=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          kubectl patch modeldeployment modelops-controller-e2e --type=merge -p \
            "{\"spec\":{\"canary\":{\"source\":\"Qwen/Qwen2.5-0.5B-Instruct\",\"revision\":\"$REVISION\",\"digest\":\"$DIGEST\",\"weight\":20,\"resources\":{\"gpu\":1,\"cpu\":\"1\",\"memory\":\"4Gi\"}}}}"
          for i in $(seq 1 45); do
            if kubectl get deployment modelops-controller-e2e-canary >/dev/null 2>&1 &&
               kubectl get service modelops-controller-e2e-canary >/dev/null 2>&1 &&
               kubectl get pvc modelops-controller-e2e-canary-cache >/dev/null 2>&1; then
              break
            fi
            sleep 4
          done
          kubectl get deployment modelops-controller-e2e-canary
          kubectl get service modelops-controller-e2e-canary
          kubectl get pvc modelops-controller-e2e-canary-cache
          # The candidate model Pod cannot be Ready without GPU and an
          # independently signed real model artifact. Its Init Container
          # must still be pinned to the correct source and checksum.
          IMAGE=$(kubectl get deployment modelops-controller-e2e-canary \
            -o jsonpath='{.spec.template.spec.initContainers[0].image}')
          test "$IMAGE" = "ghcr.io/benjamindaoson/modelops-model-loader:v0.1.0"
          GOT_REV=$(kubectl get deployment modelops-controller-e2e-canary \
            -o jsonpath='{.spec.template.spec.initContainers[0].env[?(@.name=="MODEL_REVISION")].value}')
          test "$GOT_REV" = "$REVISION"
          GOT_HASH=$(kubectl get deployment modelops-controller-e2e-canary \
            -o jsonpath='{.spec.template.spec.initContainers[0].env[?(@.name=="MODEL_ARTIFACT_SHA256")].value}')
          test "$GOT_HASH" = "$DIGEST"
          echo "Canary deployment has a real pinned model-loader; no real GPU serving claim."

          # Removing Canary must delete its owned K8s resources to avoid GPU
          # and PV leaks, not just disable a LiteLLM route.
          kubectl patch modeldeployment modelops-controller-e2e --type=merge \
            -p '{"spec":{"canary":null}}'
          for i in $(seq 1 45); do
            if ! kubectl get deployment modelops-controller-e2e-canary >/dev/null 2>&1 &&
               ! kubectl get service modelops-controller-e2e-canary >/dev/null 2>&1 &&
               ! kubectl get pvc modelops-controller-e2e-canary-cache >/dev/null 2>&1; then
              echo "Canary resources fully cleaned up by Operator."
              exit 0
            fi
            sleep 4
          done
          kubectl get pods,deploy,pvc,svc,pdb
          kubectl logs deployment/modelops-op-operator --tail=100
          exit 1

      - name: Boot tenant-specific Operator for full Control API integration
        run: |
          kubectl create namespace modelops-ci
          kubectl -n modelops-ci create secret generic kube-llmops-litellm-secret \
            --from-literal=master-key=test-only-not-valid-for-production
          helm install modelops-ci-op operator/charts/kube-llmops-operator \
            --namespace modelops-ci \
            --set image.repository=modelops/operator --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent --set gateway.url=http://127.0.0.1:4000 \
            --wait --timeout 8m
          kubectl -n modelops-ci rollout status deployment/modelops-ci-op-operator --timeout=180s
          SA=system:serviceaccount:modelops-ci:kube-llmops-operator
          kubectl auth can-i create deployments --as="$SA" -n modelops-ci --quiet
          if kubectl auth can-i create deployments --as="$SA" -n default --quiet; then
            echo "Cross-tenant Operator permission detected" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run actual FastAPI to Kubernetes ModelDeployment lifecycle E2E
        env:
          MODELOPS_KIND_E2E: "1"
          MODELOPS_RUNTIME: kubernetes
          MODELOPS_ENV: test
          MODELOPS_AUTH_MODE: dev
          MODELOPS_JWT_SECRET: only-for-tests-32-chars-plus-000000000
        run: |
          python -m pip install -e "./control-plane[dev]"
          python -m pytest -q control-plane/tests/test_kind_runtime_e2e.py
      - name: Inspect API-integrated Kubernetes resources on failure
        if: failure()
        run: |
          kubectl -n modelops-ci get modeldeployments,deployments,services,pvc,pods -o wide || true
          kubectl -n modelops-ci logs deployment/modelops-ci-op-operator --tail=150 || true
