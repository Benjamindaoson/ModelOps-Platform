name: ModelOps CI — static and controller checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/modelops-ci.yml"
      - "operator/**"
      - "charts/**"
      - "images/model-resolver/**"
      - "tests/helm/**"
      - "benchmarks/inference/**"
      - "pipelines/**"
      - "images/deploy-runner/**"
      - "ops/**"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: modelops-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Resolve chart dependencies
        run: helm dependency update charts/kube-llmops-stack
      - name: Validate CPU-only and fine-tune chart manifests
        run: |
          set -euo pipefail
          helm lint charts/kube-llmops-stack -f charts/kube-llmops-stack/values-ci.yaml
          helm template modelops charts/kube-llmops-stack -f charts/kube-llmops-stack/values-ci.yaml > /tmp/modelops-ci.yaml
          helm template modelops charts/kube-llmops-stack -f charts/kube-llmops-stack/values-ci-finetune.yaml > /tmp/modelops-finetune.yaml
          test -s /tmp/modelops-ci.yaml
          test -s /tmp/modelops-finetune.yaml

  operator-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Test engine selection, resource builders and gateway
        working-directory: operator
        run: go test ./api/v1alpha1 ./internal/engine ./internal/builder ./internal/gateway ./internal/helmbridge ./internal/cli/...

  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - run: python -m pip install pytest pyyaml
      - run: helm dependency update charts/kube-llmops-stack
      - name: Verify model resolution and Helm contract tests
        run: |
          python -m pytest images/model-resolver/tests/ tests/helm/ -q --tb=short

  evidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm attribution and independent validation plan
        run: |
          test -s LICENSE
          test -s docs/UPSTREAM_PROVENANCE.md
          test -s docs/upstream/README.md
          test -s docs/IMPLEMENTATION_PLAN.md
          echo "Static/CPU-only CI. This job does NOT validate GPU inference or fine-tuning."

  benchmark-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify benchmark CLI without GPU or vLLM
        run: |
          python -m unittest discover -s benchmarks/inference -p 'test_*.py' -v
          python benchmarks/inference/run.py \
            --base-url http://127.0.0.1:8000 --model dry-run-model --dry-run

  training-evidence-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify independent heldout evaluation and checkpoint merge
        run: |
          python -m unittest discover -s pipelines/evaluation -p 'test_*.py' -v
          python -m unittest discover -s pipelines/training -p 'test_*.py' -v

  argo-render-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Resolve chart dependencies
        run: helm dependency update charts/kube-llmops-stack
      - name: Offline-render the actual Argo DAG and embedded model scripts
        run: |
          helm template modelops charts/kube-llmops-stack \
            -f charts/kube-llmops-stack/values-ci-finetune.yaml \
            --set finetune.renderWorkflowsWithoutCRD=true > /tmp/modelops-with-argo.yaml
          grep -q "kind: WorkflowTemplate" /tmp/modelops-with-argo.yaml
          grep -q "name: quality-gate" /tmp/modelops-with-argo.yaml
          grep -q "APPROVED.json" /tmp/modelops-with-argo.yaml
          grep -q "kind: ConfigMap" /tmp/modelops-with-argo.yaml
          echo "Argo manifests rendered — NOT actual model training."

  operations-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production preflight YAML validator
        run: python -m pip install "PyYAML==6.0.2"
      - name: Verify live HTTP protocol contracts and production preflight
        run: python -m unittest discover -s ops -p "test_*.py" -v
      - name: Reject unsafe upstream production example
        run: |
          if python ops/preflight.py --values charts/kube-llmops-stack/values-production.yaml; then
            echo "Unsafe upstream production examples must NOT pass security preflight"
            exit 1
          fi
