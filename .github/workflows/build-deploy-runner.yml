name: Build ModelOps deploy-runner image
on:
  push:
    branches: [main]
    paths: ["images/deploy-runner/**", ".github/workflows/build-deploy-runner.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/deploy-runner
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/benjamindaoson/modelops-deploy-runner:v0.1.0
            ghcr.io/benjamindaoson/modelops-deploy-runner:sha-${{ github.sha }}
          provenance: true
