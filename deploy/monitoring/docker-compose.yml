services:
  prometheus:
    image: prom/prometheus:v3.15.0
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus","--web.listen-address=127.0.0.1:19790","--storage.tsdb.retention.time=7d"]
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus-data:/prometheus"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  grafana:
    image: grafana/grafana:13.2.3
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "19791"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a strong unique password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - "./provisioning:/etc/grafana/provisioning:ro"
      - "./modelops-dashboard.json:/var/lib/grafana/dashboards/modelops.json:ro"
      - "grafana-data:/var/lib/grafana"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  prometheus-data:
  grafana-data:
