# Base model
baseModel: ""
outputName: ""

# Training method
method: lora              # lora | qlora | full
loraRank: 8
loraAlpha: 16
epochs: 3
batchSize: 4
learningRate: 2e-4
maxSamples: 0               # 0 = use all samples
gradientAccumulationSteps: 4
saveSteps: 500
warmupRatio: 0.1
loggingSteps: 10

# Data source
dataSource:
  type: minio             # minio | huggingface | pvc
  path: ""
  format: alpaca          # alpaca | sharegpt | custom

# GPU resources
resources:
  gpu: 1
  memory: 16Gi
  cpu: "4"

# Node scheduling
nodeSelector: {}
tolerations: []

# Independent holdout quality evaluation. train.json and heldout.jsonl
# must be present in the downloaded dataset. Absence aborts the workflow.
# Token F1 is lexical match, not semantic faithfulness.
# Runtime jobs must evaluate real weights before any release is approved.
renderWorkflowsWithoutCRD: false
# The legacy fixed-config example remains available for existing installations;
# this new dynamic Argo template accepts exact parameters per FineTuneRun.
staticTemplate:
  enabled: true
dynamicTemplate:
  enabled: true
  image: hiyouga/llamafactory:latest
  prepareImage: python:3.12-slim
  workspaceSize: 60Gi
  objectStoreSecret: modelops-objectstore
  mlflowTrackingURI: ""  # Existing external MLflow service (no inline credentials)

evaluation:
  enabled: true
  minSamples: 20
  maxNewTokens: 128
  benchmarks:
    - ragas
  thresholds:
    tokenF1: 0.55
    minDeltaTokenF1: -0.02
    # Old illustrative keys retained only for chart compatibility;
    # they are NOT used by the ModelOps artifact gate.
    faithfulness: 0.7
    answer_relevancy: 0.7

# Deployment strategy
deploy:
  auto: false
  runnerImage: ghcr.io/benjamindaoson/modelops-deploy-runner:v0.1.0
  canaryPercent: 20
  notifyWebhook: ""

# Schedule (empty = manual, cron expression = periodic)
schedule: ""

# MLflow
mlflow:
  enabled: true
  image:
    repository: kube-llmops/mlflow
    tag: "latest"
    pullPolicy: IfNotPresent
  postgresql:
    database: mlflow
    username: mlflow
    password: mlflow-default-pw
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# PDB
pdb:
  enabled: true
