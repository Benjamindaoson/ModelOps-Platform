{{- $_ := required "finetune.baseModel is required when finetune is enabled" .Values.baseModel }}
{{- $_ := required "finetune.outputName is required when finetune is enabled" .Values.outputName }}
{{- if and (eq .Values.dataSource.type "minio") (not .Values.dataSource.path) }}
{{- fail "finetune.dataSource.path is required when dataSource.type is 'minio'" }}
{{- end }}
{{- if and (eq .Values.dataSource.type "huggingface") (not .Values.dataSource.path) }}
{{- fail "finetune.dataSource.path is required when dataSource.type is 'huggingface'" }}
{{- end }}
{{- if not (has .Values.method (list "lora" "qlora" "full")) }}
{{- fail "finetune.method must be one of: lora, qlora, full" }}
{{- end }}
{{- if or .Values.renderWorkflowsWithoutCRD (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "workflows.argoproj.io") }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ .Release.Name }}-finetune
  labels:
    app.kubernetes.io/name: finetune
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  serviceAccountName: {{ .Release.Name }}-finetune
  activeDeadlineSeconds: 21600
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: prepare-data
            template: prepare-data
          - name: finetune
            template: finetune
            dependencies: [prepare-data]
          - name: merge-upload
            template: merge-upload
            dependencies: [finetune]
          - name: evaluate
            template: evaluate
            dependencies: [merge-upload]
          - name: quality-gate
            template: quality-gate
            dependencies: [evaluate]
          - name: deploy
            template: deploy
            dependencies: [quality-gate]
    - name: prepare-data
      container:
        image: {{ (default dict (default dict .Values.global).modelStore).image | default "kube-llmops/model-loader:latest" }}
        imagePullPolicy: IfNotPresent
        command: [bash, -c]
        args:
          - |
            set -e
            echo "=== Preparing training data ==="
            pip install -q minio huggingface_hub hf-transfer 2>/dev/null || true
            export HF_HUB_ENABLE_HF_TRANSFER=1

            # Download base model — MinIO first, fallback to HuggingFace
            echo "Downloading base model: {{ .Values.baseModel }}"
            python3 -c "
            import os, sys, logging, shutil
            from pathlib import Path
            logging.basicConfig(level=logging.INFO, format='%(asctime)s [prepare-data] %(levelname)s %(message)s')
            log = logging.getLogger('prepare-data')

            # Patch hf-transfer concurrency (max concurrent file downloads)
            _hf_concurrency = int(os.environ.get('HF_TRANSFER_CONCURRENCY', '32'))
            try:
                import hf_transfer as _hft
                _orig_dl = _hft.download
                def _patched_dl(*a, **kw):
                    kw['max_files'] = _hf_concurrency
                    return _orig_dl(*a, **kw)
                _hft.download = _patched_dl
                log.info(f'hf-transfer concurrency per file: {_hf_concurrency}')
            except Exception:
                pass

            source = '{{ .Values.baseModel }}'
            slug = source.replace('/', '--')
            target = Path('/workspace/base-model')
            target.mkdir(parents=True, exist_ok=True)

            endpoint = os.environ.get('S3_ENDPOINT', '')
            bucket = os.environ.get('S3_BUCKET', 'models')
            ak = os.environ.get('S3_ACCESS_KEY', 'minioadmin')
            sk = os.environ.get('S3_SECRET_KEY', 'minioadmin')

            downloaded = False

            # Try MinIO first
            if endpoint:
                try:
                    from minio import Minio
                    mc = Minio(endpoint, access_key=ak, secret_key=sk, secure=False)
                    prefix = slug + '/'
                    objs = list(mc.list_objects(bucket, prefix=prefix, recursive=False))
                    if objs:
                        log.info(f'Found in MinIO: s3://{bucket}/{prefix}')
                        for obj in mc.list_objects(bucket, prefix=prefix, recursive=True):
                            rel = obj.object_name[len(prefix):]
                            if not rel: continue
                            fpath = target / rel
                            fpath.parent.mkdir(parents=True, exist_ok=True)
                            if fpath.exists() and fpath.stat().st_size == obj.size:
                                log.info(f'  Cached: {rel}')
                                continue
                            log.info(f'  Downloading from MinIO: {rel} ({obj.size/(1024**2):.1f} MB)')
                            mc.fget_object(bucket, obj.object_name, str(fpath))
                        downloaded = True
                        log.info(f'MinIO sync complete → {target}')
                except Exception as e:
                    log.warning(f'MinIO unavailable ({e}), falling back to HuggingFace')

            # Fallback to HuggingFace
            if not downloaded:
                log.info(f'Downloading from HuggingFace: {source}')
                from huggingface_hub import snapshot_download
                snap = snapshot_download(repo_id=source, cache_dir=str(target / '.hf_cache'))
                log.info(f'Downloaded to cache: {snap}')
                snap_path = Path(snap)
                for f in snap_path.rglob('*'):
                    if not f.is_file(): continue
                    rel = f.relative_to(snap_path)
                    dst = target / rel
                    dst.parent.mkdir(parents=True, exist_ok=True)
                    real_f = f.resolve()
                    if dst.exists() and dst.stat().st_size == real_f.stat().st_size:
                        continue
                    shutil.copy2(str(real_f), str(dst))

                # Upload to MinIO for next time
                if endpoint:
                    try:
                        count = 0
                        for fpath in target.rglob('*'):
                            if not fpath.is_file() or '.hf_cache' in str(fpath): continue
                            obj_name = prefix + str(fpath.relative_to(target))
                            mc.fput_object(bucket, obj_name, str(fpath))
                            count += 1
                        log.info(f'Uploaded {count} files to MinIO')
                    except Exception as e:
                        log.warning(f'Failed to cache model in MinIO: {e}')

            log.info('Base model ready.')
            "

            # Prepare training data
            {{- if eq .Values.dataSource.type "minio" }}
            python3 -c "
            from minio import Minio
            import os
            endpoint = os.environ.get('S3_ENDPOINT', '{{ $.Release.Name }}-minio:9000')
            ak = os.environ.get('S3_ACCESS_KEY', 'minioadmin')
            sk = os.environ.get('S3_SECRET_KEY', 'minioadmin')
            client = Minio(endpoint, access_key=ak, secret_key=sk, secure=False)
            path = '{{ .Values.dataSource.path }}'.replace('s3://', '')
            bucket = path.split('/')[0]
            prefix = '/'.join(path.split('/')[1:])
            os.makedirs('/workspace/data', exist_ok=True)
            for obj in client.list_objects(bucket, prefix=prefix, recursive=True):
                fname = obj.object_name.split('/')[-1]
                if fname:
                    client.fget_object(bucket, obj.object_name, f'/workspace/data/{fname}')
                    print(f'Downloaded: {fname}')
            "
            {{- else if eq .Values.dataSource.type "huggingface" }}
            pip install -q datasets 2>/dev/null || true
            python3 -c "
            from datasets import load_dataset
            import json, os
            ds = load_dataset('{{ .Values.dataSource.path }}', split='train')
            os.makedirs('/workspace/data', exist_ok=True)
            with open('/workspace/data/train.json', 'w') as f:
                json.dump([dict(row) for row in ds], f, ensure_ascii=False, indent=2)
            print(f'Downloaded {len(ds)} samples')
            "
            {{- else }}
            echo "Using PVC-mounted data at /workspace/data"
            {{- end }}

            echo "=== Data preparation complete ==="
            ls -la /workspace/data/
            ls -la /workspace/base-model/ | head -10
        env:
          - name: HF_HUB_ENABLE_HF_TRANSFER
            value: "1"
          - name: HF_TRANSFER_CONCURRENCY
            value: {{ (default dict (default dict .Values.global).modelStore).hfTransferConcurrency | default "32" | quote }}
          {{- if and .Values.global .Values.global.modelStore }}
          - name: S3_ENDPOINT
            value: {{ .Values.global.modelStore.endpoint | quote }}
          - name: S3_BUCKET
            value: {{ .Values.global.modelStore.bucket | default "models" | quote }}
          - name: S3_ACCESS_KEY
            value: {{ .Values.global.modelStore.accessKey | default "minioadmin" | quote }}
          - name: S3_SECRET_KEY
            value: {{ .Values.global.modelStore.secretKey | default "minioadmin" | quote }}
          {{- end }}
          {{- if and .Values.global .Values.global.hfToken }}
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-hf-token
                key: token
          {{- end }}
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: "1"
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 2Gi
    - name: finetune
      container:
        image: hiyouga/llamafactory:latest
        imagePullPolicy: IfNotPresent
        command: [bash, -c]
        args:
          - |
            set -e
            echo "=== Starting fine-tuning ==="
            echo "Method: {{ .Values.method }}"
            echo "Model: {{ .Values.baseModel }}"

            # Install mlflow for experiment tracking
            pip install -q mlflow 2>/dev/null || true

            # Copy training config from ConfigMap
            cp /config/train_config.yaml /workspace/train_config.yaml

            # Create dataset_info.json for LLaMA-Factory
            python3 -c "
            import json, os, glob
            data_files = glob.glob('/workspace/data/*.json') + glob.glob('/workspace/data/*.jsonl')
            info = {'train': {'file_name': data_files[0] if data_files else '/workspace/data/train.json'}}
            with open('/workspace/data/dataset_info.json', 'w') as f:
                json.dump(info, f)
            print(f'Dataset info: {info}')
            "

            {{- if eq (int .Values.resources.gpu) 0 }}
            # Force CPU-only mode to avoid CUDA init crash in GPU containers
            export CUDA_VISIBLE_DEVICES=""
            export USE_CPU=1
            # Disable torch.compile (inductor) — compilation takes too long on CPU
            export TORCHINDUCTOR_DISABLE=1
            export TORCH_COMPILE_DISABLE=1
            # Force eager attention to avoid SDPA torch.compile overhead on CPU
            sed -i '/^model_name_or_path:/a flash_attn: disabled' /workspace/train_config.yaml
            echo "torch_compile: false" >> /workspace/train_config.yaml
            {{- end }}

            llamafactory-cli train /workspace/train_config.yaml

            echo "=== Fine-tuning complete ==="
            ls -la /workspace/output/
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://{{ $.Release.Name }}-mlflow:5000"
          - name: MLFLOW_EXPERIMENT_NAME
            value: {{ .Values.outputName | quote }}
          {{- if eq (int .Values.resources.gpu) 0 }}
          - name: CUDA_VISIBLE_DEVICES
            value: ""
          - name: NVIDIA_VISIBLE_DEVICES
            value: "none"
          - name: TORCHDYNAMO_DISABLE
            value: "1"
          - name: TORCHINDUCTOR_DISABLE
            value: "1"
          {{- end }}
          - name: HF_HUB_ENABLE_HF_TRANSFER
            value: "1"
          - name: HF_TRANSFER_CONCURRENCY
            value: {{ (default dict (default dict .Values.global).modelStore).hfTransferConcurrency | default "32" | quote }}
          {{- if and .Values.global .Values.global.hfToken }}
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-hf-token
                key: token
          {{- end }}
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: train-config
            mountPath: /config
        resources:
          requests:
            cpu: {{ .Values.resources.cpu | quote }}
            memory: {{ .Values.resources.memory }}
            {{- if gt (int .Values.resources.gpu) 0 }}
            nvidia.com/gpu: {{ .Values.resources.gpu | quote }}
            {{- end }}
          limits:
            {{- if gt (int .Values.resources.gpu) 0 }}
            nvidia.com/gpu: {{ .Values.resources.gpu | quote }}
            {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: train-config
          configMap:
            name: {{ $.Release.Name }}-finetune-config
    - name: merge-upload
      container:
        image: hiyouga/llamafactory:latest
        imagePullPolicy: IfNotPresent
        command: [bash, -c]
        args:
          - |
            set -e
            pip install -q 'minio>=7,<8' 'mlflow>=2,<4'

            echo "=== Merging and uploading model ==="
            OUTPUT_NAME="{{ .Values.outputName }}"
            mkdir -p /workspace/eval
            # Actual PEFT merge, not just renaming an adapter checkpoint.
            python3 /opt/modelops/merge.py \
              --base /workspace/base-model \
              --trained /workspace/output \
              --output /workspace/merged \
              --method "{{ .Values.method }}" \
              --receipt /workspace/eval/merge_receipt.json

            # Upload to MinIO
            python3 -c "
            from minio import Minio
            from pathlib import Path
            import os

            endpoint = os.environ.get('S3_ENDPOINT', '{{ $.Release.Name }}-minio:9000')
            ak = os.environ.get('AWS_ACCESS_KEY_ID', 'minioadmin')
            sk = os.environ.get('AWS_SECRET_ACCESS_KEY', 'minioadmin')
            client = Minio(endpoint, access_key=ak, secret_key=sk, secure=False)
            if not client.bucket_exists('models'):
                client.make_bucket('models')

            output_dir = Path('/workspace/merged')
            prefix = '${OUTPUT_NAME}/'
            count = 0
            for fpath in output_dir.rglob('*'):
                if not fpath.is_file(): continue
                obj_name = prefix + str(fpath.relative_to(output_dir))
                client.fput_object('models', obj_name, str(fpath))
                count += 1
            if count == 0: raise RuntimeError('No merged model files uploaded')
            print(f'Uploaded {count} verified merged model files to s3://models/${OUTPUT_NAME}/')
            "

            # Register in MLflow Model Registry
            python3 -c "
            import mlflow
            import os

            mlflow.set_tracking_uri(os.environ.get('MLFLOW_TRACKING_URI', 'http://{{ $.Release.Name }}-mlflow:5000'))
            # S3 credentials are already set via env vars (MLFLOW_S3_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)

            model_uri = 's3://models/${OUTPUT_NAME}/'
            result = mlflow.register_model(model_uri, '${OUTPUT_NAME}')
            print(f'Registered model: ${OUTPUT_NAME} version {result.version}')

            client = mlflow.tracking.MlflowClient()
            client.transition_model_version_stage('${OUTPUT_NAME}', result.version, 'Staging')
            print(f'Model version {result.version} → Staging')

            # Save version for downstream steps
            with open('/workspace/eval/model_version.txt', 'w') as f:
                f.write(str(result.version))
            "

            echo "=== Upload complete ==="
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://{{ $.Release.Name }}-mlflow:5000"
          - name: MLFLOW_S3_ENDPOINT_URL
            value: "http://{{ $.Release.Name }}-minio:9000"
          - name: S3_ENDPOINT
            value: "{{ $.Release.Name }}-minio:9000"
          {{- if and .Values.global .Values.global.modelStore }}
          - name: AWS_ACCESS_KEY_ID
            value: {{ .Values.global.modelStore.accessKey | default "minioadmin" | quote }}
          - name: AWS_SECRET_ACCESS_KEY
            value: {{ .Values.global.modelStore.secretKey | default "minioadmin" | quote }}
          {{- else }}
          - name: AWS_ACCESS_KEY_ID
            value: "minioadmin"
          - name: AWS_SECRET_ACCESS_KEY
            value: "minioadmin"
          {{- end }}
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: modelops-scripts
            mountPath: /opt/modelops
            readOnly: true
        volumes:
          - name: modelops-scripts
            configMap:
              name: {{ $.Release.Name }}-modelops-scripts
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 32Gi
    - name: evaluate
      container:
        # The model weights are evaluated *locally* on the actual checkpoint,
        # never through the pre-existing gateway's base-model alias.
        image: hiyouga/llamafactory:latest
        imagePullPolicy: IfNotPresent
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            echo "=== ModelOps independent heldout evaluation ==="
            test -s /workspace/data/train.json
            test -s /workspace/data/heldout.jsonl
            test -s /workspace/eval/merge_receipt.json
            python3 /opt/modelops/evaluate.py run \
              --base-model /workspace/base-model \
              --candidate /workspace/merged \
              --train-data /workspace/data/train.json \
              --heldout /workspace/data/heldout.jsonl \
              --output /workspace/eval/results.json \
              --min-samples {{ .Values.evaluation.minSamples | default 20 }} \
              --max-new-tokens {{ .Values.evaluation.maxNewTokens | default 128 }}
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: modelops-scripts
            mountPath: /opt/modelops
            readOnly: true
        resources:
          requests:
            cpu: {{ .Values.resources.cpu | quote }}
            memory: {{ .Values.resources.memory }}
            {{- if gt (int .Values.resources.gpu) 0 }}
            nvidia.com/gpu: {{ .Values.resources.gpu | quote }}
            {{- end }}
          limits:
            {{- if gt (int .Values.resources.gpu) 0 }}
            nvidia.com/gpu: {{ .Values.resources.gpu | quote }}
            {{- end }}
      volumes:
        - name: modelops-scripts
          configMap:
            name: {{ $.Release.Name }}-modelops-scripts
    - name: quality-gate
      container:
        image: python:3.13-slim
        imagePullPolicy: IfNotPresent
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            echo "=== ModelOps fail-closed artifact and quality gate ==="
            python3 /opt/modelops/evaluate.py gate \
              --report /workspace/eval/results.json \
              --candidate /workspace/merged \
              --train-data /workspace/data/train.json \
              --heldout /workspace/data/heldout.jsonl \
              --approval /workspace/eval/APPROVED.json \
              --min-samples {{ .Values.evaluation.minSamples | default 20 }} \
              --min-f1 {{ .Values.evaluation.thresholds.tokenF1 | default 0.55 }} \
              --min-delta {{ .Values.evaluation.thresholds.minDeltaTokenF1 | default -0.02 }}
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: modelops-scripts
            mountPath: /opt/modelops
            readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
      volumes:
        - name: modelops-scripts
          configMap:
            name: {{ $.Release.Name }}-modelops-scripts
    - name: deploy
      container:
        image: {{ .Values.deploy.runnerImage | default "ghcr.io/benjamindaoson/modelops-deploy-runner:v0.1.0" | quote }}
        imagePullPolicy: IfNotPresent
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            # Deploy only after checksum-verifiable independent holdout approval.
            test -s /workspace/eval/APPROVED.json
            test -s /workspace/eval/model_version.txt
            OUTPUT_NAME="{{ .Values.outputName }}"
            RELEASE="{{ $.Release.Name }}"
            NAMESPACE="{{ $.Release.Namespace }}"
            CANARY_PERCENT="{{ .Values.deploy.canaryPercent }}"
            STABLE_PERCENT=$((100 - ${CANARY_PERCENT}))
            VERSION=$(cat /workspace/eval/model_version.txt)

            echo "=== Deploy Step ==="
            echo "Model: ${OUTPUT_NAME} (version ${VERSION})"
            cat /workspace/eval/results.json

            {{- if not .Values.deploy.auto }}
            # --- Manual approval mode ---
            echo "deploy.auto=false — sending notification only"

            {{- if .Values.deploy.notifyWebhook }}
            METRICS=$(cat /workspace/eval/results.json)
            cat > /tmp/webhook-payload.json << PAYLOAD
            {
              "model": "${OUTPUT_NAME}",
              "version": "${VERSION}",
              "status": "PASSED",
              "metrics": ${METRICS},
              "mlflow_url": "http://{{ $.Release.Name }}-mlflow:5000/#/models/${OUTPUT_NAME}/versions/${VERSION}",
              "approve_cmd": "argo submit -n ${NAMESPACE} --from workflowtemplate/${RELEASE}-finetune-deploy-canary -p outputName=${OUTPUT_NAME}"
            }
            PAYLOAD
            # kubectl has curl-like capabilities via wget or we use the shell
            wget -qO- --post-file=/tmp/webhook-payload.json \
              --header='Content-Type: application/json' \
              "{{ .Values.deploy.notifyWebhook }}" 2>/dev/null || echo "WARNING: webhook notification failed (non-fatal)"
            echo "Notification sent to webhook"
            {{- else }}
            echo "No webhook configured. Model ready for manual deployment."
            echo "Model artifacts: s3://models/${OUTPUT_NAME}/"
            echo "MLflow version: ${VERSION} (Staging)"
            echo ""
            echo "To deploy canary manually, run:"
            echo "  helm upgrade ${RELEASE} charts/kube-llmops-stack \\"
            echo "    --set finetune.deploy.auto=true \\"
            echo "    --reuse-values"
            {{- end }}

            {{- else }}
            # --- Auto canary deployment ---
            echo "deploy.auto=true — creating canary deployment (${CANARY_PERCENT}% traffic)"

            # Step 1: Create a vLLM Deployment for the fine-tuned model
            DEPLOY_NAME="vllm-${OUTPUT_NAME}-ft"
            SVC_NAME="${DEPLOY_NAME}"
            MODEL_SLUG=$(echo "{{ .Values.baseModel }}" | tr '/' '--')

            cat > /tmp/canary-deployment.yaml << DEPLOYYAML
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ${DEPLOY_NAME}
              namespace: ${NAMESPACE}
              labels:
                app.kubernetes.io/name: vllm
                app.kubernetes.io/instance: ${RELEASE}
                app.kubernetes.io/component: model-serving
                app.kubernetes.io/part-of: kube-llmops
                kube-llmops/model: ${OUTPUT_NAME}
                kube-llmops/engine: vllm
                kube-llmops/canary: "true"
              annotations:
                kube-llmops/base-model: "{{ .Values.baseModel }}"
                kube-llmops/finetune-method: "{{ .Values.method }}"
                kube-llmops/mlflow-version: "${VERSION}"
            spec:
              replicas: 1
              strategy:
                type: Recreate
              selector:
                matchLabels:
                  app.kubernetes.io/name: vllm
                  kube-llmops/model: ${OUTPUT_NAME}
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: vllm
                    app.kubernetes.io/instance: ${RELEASE}
                    app.kubernetes.io/component: model-serving
                    app.kubernetes.io/part-of: kube-llmops
                    kube-llmops/model: ${OUTPUT_NAME}
                    kube-llmops/engine: vllm
                    kube-llmops/canary: "true"
                spec:
                  enableServiceLinks: false
                  initContainers:
                    - name: model-loader
                      image: {{ (default dict (default dict .Values.global).modelStore).image | default "kube-llmops/model-loader:latest" }}
                      imagePullPolicy: IfNotPresent
                      command: [bash, -c]
                      args:
                        - |
                          set -e
                          echo "Loading fine-tuned model from MinIO: ${OUTPUT_NAME}"
                          pip install -q minio 2>/dev/null || true
                          python3 -c "
                          from minio import Minio
                          import os
                          endpoint = os.environ.get('S3_ENDPOINT', '${RELEASE}-minio:9000')
                          ak = os.environ.get('S3_ACCESS_KEY', 'minioadmin')
                          sk = os.environ.get('S3_SECRET_KEY', 'minioadmin')
                          client = Minio(endpoint, access_key=ak, secret_key=sk, secure=False)
                          prefix = '${OUTPUT_NAME}/'
                          count = 0
                          for obj in client.list_objects('models', prefix=prefix, recursive=True):
                              rel = obj.object_name[len(prefix):]
                              if not rel: continue
                              fpath = f'/models/${OUTPUT_NAME}/{rel}'
                              os.makedirs(os.path.dirname(fpath), exist_ok=True)
                              client.fget_object('models', obj.object_name, fpath)
                              count += 1
                          print(f'Downloaded {count} files to /models/${OUTPUT_NAME}/')
                          "
                      env:
                        - name: S3_ENDPOINT
                          value: "${RELEASE}-minio:9000"
                        - name: S3_ACCESS_KEY
                          value: "minioadmin"
                        - name: S3_SECRET_KEY
                          value: "minioadmin"
                      volumeMounts:
                        - name: model-cache
                          mountPath: /models
                      resources:
                        requests:
                          cpu: "1"
                          memory: 1Gi
                  containers:
                    - name: vllm
                      image: "vllm/vllm-openai:latest"
                      imagePullPolicy: IfNotPresent
                      ports:
                        - name: http
                          containerPort: 8000
                          protocol: TCP
                      command: ["/bin/bash", "-c"]
                      args:
                        - |
                          MODEL_PATH="/models/${OUTPUT_NAME}"
                          if [ ! -d "\$MODEL_PATH" ] || [ -z "\$(ls -A \$MODEL_PATH 2>/dev/null)" ]; then
                            echo "ERROR: Model not found at \$MODEL_PATH"
                            exit 1
                          fi
                          echo "Starting vLLM with fine-tuned model at \$MODEL_PATH"
                          python3 -m vllm.entrypoints.openai.api_server \
                            --model "\$MODEL_PATH" \
                            --served-model-name "${OUTPUT_NAME}" \
                            --host 0.0.0.0 \
                            --port 8000 \
                            --max-model-len 4096 \
                            --gpu-memory-utilization 0.8
                      readinessProbe:
                        httpGet:
                          path: /health
                          port: 8000
                        initialDelaySeconds: 30
                        periodSeconds: 10
                        failureThreshold: 30
                      livenessProbe:
                        httpGet:
                          path: /health
                          port: 8000
                        initialDelaySeconds: 60
                        periodSeconds: 30
                      resources:
                        requests:
                          cpu: {{ .Values.resources.cpu | quote }}
                          memory: {{ .Values.resources.memory }}
                          {{- if gt (int .Values.resources.gpu) 0 }}
                          nvidia.com/gpu: {{ .Values.resources.gpu | quote }}
                          {{- end }}
                        limits:
                          {{- if gt (int .Values.resources.gpu) 0 }}
                          nvidia.com/gpu: {{ .Values.resources.gpu | quote }}
                          {{- end }}
                      volumeMounts:
                        - name: model-cache
                          mountPath: /models
                        - name: shm
                          mountPath: /dev/shm
                  volumes:
                    - name: model-cache
                      emptyDir: {}
                    - name: shm
                      emptyDir:
                        medium: Memory
                        sizeLimit: 8Gi
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: ${SVC_NAME}
              namespace: ${NAMESPACE}
              labels:
                app.kubernetes.io/name: vllm
                app.kubernetes.io/instance: ${RELEASE}
                app.kubernetes.io/part-of: kube-llmops
                kube-llmops/model: ${OUTPUT_NAME}
                kube-llmops/canary: "true"
            spec:
              type: ClusterIP
              ports:
                - port: 8000
                  targetPort: 8000
                  name: http
              selector:
                app.kubernetes.io/name: vllm
                kube-llmops/model: ${OUTPUT_NAME}
            DEPLOYYAML

            echo "Creating canary Deployment and Service..."
            kubectl apply -f /tmp/canary-deployment.yaml

            # Step 2: Wait for the canary pod to be ready
            echo "Waiting for canary pod to become ready (timeout: 10m)..."
            kubectl rollout status deployment/${DEPLOY_NAME} -n ${NAMESPACE} --timeout=600s || {
              echo "ERROR: Canary deployment failed to become ready"
              echo "Cleaning up failed deployment..."
              kubectl delete deployment/${DEPLOY_NAME} -n ${NAMESPACE} --ignore-not-found
              kubectl delete service/${SVC_NAME} -n ${NAMESPACE} --ignore-not-found
              exit 1
            }
            echo "Canary pod is ready!"

            # Step 3: Patch LiteLLM ConfigMap to add canary weight routing
            echo "Patching LiteLLM ConfigMap for canary routing..."

            # Get existing config, add canary entry with weights
            kubectl get configmap ${RELEASE}-litellm-config -n ${NAMESPACE} -o jsonpath='{.data.config\.yaml}' > /tmp/litellm-config.yaml

            # Find the base model name that matches our fine-tune base
            BASE_MODEL_NAME=""
            {{- if and .Values.global .Values.global.models }}
            {{- range .Values.global.models }}
            {{- $ftEngine := include "kube-llmops.resolveEngine" (dict "model" . "global" $.Values.global) | trim }}
            {{- if or (eq $ftEngine "vllm") (eq $ftEngine "sglang") (eq $ftEngine "chitu") }}
            if [ -z "${BASE_MODEL_NAME}" ]; then
              BASE_MODEL_NAME="{{ .name }}"
            fi
            {{- end }}
            {{- end }}
            {{- end }}

            if [ -n "${BASE_MODEL_NAME}" ]; then
              echo "Adding canary entry for base model: ${BASE_MODEL_NAME}"
              # Add weight to existing model and create canary entry
              export BASE_MODEL_NAME
              python3 - << 'PATCHSCRIPT'
            import yaml, sys, os

            config_path = '/tmp/litellm-config.yaml'
            with open(config_path) as f:
                config = yaml.safe_load(f)

            base_model = os.environ.get('BASE_MODEL_NAME', '')
            output_name = os.environ.get('OUTPUT_NAME', '')
            svc_name = os.environ.get('SVC_NAME', '')
            namespace = os.environ.get('NAMESPACE', 'default')
            stable_pct = int(os.environ.get('STABLE_PERCENT', '80'))
            canary_pct = int(os.environ.get('CANARY_PERCENT', '20'))

            model_list = config.get('model_list', [])

            # Add weight to existing base model entries
            for entry in model_list:
                if entry.get('model_name') == base_model:
                    entry['litellm_params']['weight'] = stable_pct

            # Add canary entry (same model_name so LiteLLM routes to both)
            canary_entry = {
                'model_name': base_model,
                'litellm_params': {
                    'model': f'openai/{output_name}',
                    'api_base': f'http://{svc_name}.{namespace}.svc.cluster.local:8000/v1',
                    'api_key': 'no-key-needed',
                    'weight': canary_pct
                }
            }
            model_list.append(canary_entry)
            config['model_list'] = model_list

            with open(config_path, 'w') as f:
                yaml.dump(config, f, default_flow_style=False)

            print(f'Canary routing: {base_model} → stable:{stable_pct}% canary:{canary_pct}%')
            PATCHSCRIPT

              # Apply patched ConfigMap
              kubectl create configmap ${RELEASE}-litellm-config \
                --from-file=config.yaml=/tmp/litellm-config.yaml \
                -n ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
              echo "ConfigMap patched."

              # Step 4: Restart LiteLLM to pick up new config
              echo "Restarting LiteLLM to load canary config..."
              kubectl rollout restart statefulset/${RELEASE}-litellm -n ${NAMESPACE} 2>/dev/null || \
              kubectl rollout restart deployment/${RELEASE}-litellm -n ${NAMESPACE} 2>/dev/null || \
              { echo "ERROR: Could not restart LiteLLM"; exit 1; }

            else
              echo "WARNING: No base vLLM model found — canary routing not configured"
              echo "Fine-tuned model is deployed at: http://${SVC_NAME}:8000/v1"
            fi

            echo ""
            echo "=== Canary deployment complete ==="
            echo "Fine-tuned model: ${OUTPUT_NAME} (MLflow v${VERSION})"
            echo "Traffic split: stable=${STABLE_PERCENT}% canary=${CANARY_PERCENT}%"
            echo ""
            echo "To promote to 100%:"
            echo "  kubectl patch configmap ${RELEASE}-litellm-config ..."
            echo "To rollback:"
            echo "  kubectl delete deployment ${DEPLOY_NAME} -n ${NAMESPACE}"
            echo "  kubectl delete service ${SVC_NAME} -n ${NAMESPACE}"

            {{- if .Values.deploy.notifyWebhook }}
            # Send deployment notification
            METRICS=$(cat /workspace/eval/results.json)
            cat > /tmp/deploy-notification.json << NOTIF
            {
              "model": "${OUTPUT_NAME}",
              "version": "${VERSION}",
              "status": "CANARY_DEPLOYED",
              "canary_percent": ${CANARY_PERCENT},
              "metrics": ${METRICS},
              "rollback_cmd": "kubectl delete deployment ${DEPLOY_NAME} -n ${NAMESPACE} && kubectl delete service ${SVC_NAME} -n ${NAMESPACE}"
            }
            NOTIF
            wget -qO- --post-file=/tmp/deploy-notification.json \
              --header='Content-Type: application/json' \
              "{{ .Values.deploy.notifyWebhook }}" 2>/dev/null || true
            {{- end }}

            {{- end }}

            echo "=== Deploy step complete ==="
        env:
          - name: OUTPUT_NAME
            value: {{ .Values.outputName | quote }}
          - name: NAMESPACE
            value: "{{ $.Release.Namespace }}"
          - name: BASE_MODEL_NAME
            value: ""
          - name: SVC_NAME
            value: "vllm-{{ .Values.outputName }}-ft"
          - name: STABLE_PERCENT
            value: "{{ sub 100 (int .Values.deploy.canaryPercent) }}"
          - name: CANARY_PERCENT
            value: {{ .Values.deploy.canaryPercent | quote }}
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
{{- end }}
