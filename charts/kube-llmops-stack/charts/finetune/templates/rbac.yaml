# FineTune service accounts require permissions ONLY in their release namespace.
# Argo CRDs and tenant namespaces are installed separately by cluster bootstrap.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-finetune
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: finetune
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-finetune
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: finetune
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-finetune
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: finetune
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-finetune
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-finetune
    namespace: {{ .Release.Namespace }}
