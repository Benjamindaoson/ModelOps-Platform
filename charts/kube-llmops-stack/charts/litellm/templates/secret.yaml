{{- if not .Values.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-litellm-secret" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-litellm-secret
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
type: Opaque
data:
  {{- if $existing }}
  master-key: {{ index $existing.data "master-key" }}
  {{- else }}
  master-key: {{ .Values.masterKey | default (printf "sk-%s" (randAlphaNum 32)) | b64enc }}
  {{- end }}
{{- end }}
