[alembic]
script_location = migrations
prepend_sys_path = .
# The database URL is taken from MODELOPS_DATABASE_URL by migrations/env.py,
# never committed to source or printed in logs.
sqlalchemy.url = sqlite:///./modelops.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
